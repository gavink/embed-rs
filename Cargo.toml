[package]
name = "embed-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core      = "0.8"
candle-nn        = "0.8"
candle-transformers = "0.8"
tokenizers       = "0.21"
clap             = { version = "4", features = ["derive"] }
anyhow           = "1"
log              = "0.4"
env_logger       = "0.11"
serde_json       = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
